<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acme — Reset password</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <main>
    <a class="back" href="index.html">← All variants</a>
    <p class="brand">ACME // NODE</p>
    <h1>Reset password</h1>
    <p class="lede">Only new + confirm (no current). Seed user → Update offer.</p>
    <form id="change-form" autocomplete="on">
      <label>
        Username
        <input id="identifier" name="username" type="text" autocomplete="username" required />
      </label>
      <label>
        New password
        <input id="password" name="password" type="password" autocomplete="new-password" required />
      </label>
      <label>
        Confirm
        <input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" required />
      </label>
      <button type="submit">Set new password</button>
    </form>
    <p id="result" aria-live="polite"></p>
  </main>
  <script src="shared.js"></script>
  <script>acmeWireChangePassword({ idField: "identifier", defaultUser: "alice@acme.test" });</script>
</body>
</html>
