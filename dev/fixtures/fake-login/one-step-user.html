<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acme — One step username</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <main>
    <a class="back" href="index.html">← All variants</a>
    <p class="brand">ACME // NODE</p>
    <h1>One step username</h1>
    <p class="lede">Single form with username + password.</p>
    <form id="login-form" autocomplete="on">
      <label>
        Username
        <input id="identifier" name="username" type="text" autocomplete="username" required />
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Sign in</button>
    </form>
    <p id="result" aria-live="polite"></p>
    <p class="hint">Talos should offer multiple matches for this host. Any seeded account can sign in.</p>
  </main>
  <script src="shared.js"></script>
  <script>acmeWireOneStep({ idField: "identifier" });</script>
</body>
</html>
