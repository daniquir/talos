<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acme — Change password</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <main>
    <a class="back" href="index.html">← All variants</a>
    <p class="brand">ACME // NODE</p>
    <h1>Change password</h1>
    <p class="lede">Current + new + confirm for a <strong>seed</strong> user → Talos should offer <strong>Update</strong>.</p>
    <form id="change-form" autocomplete="on">
      <label>
        Username
        <input id="identifier" name="username" type="text" autocomplete="username" required />
      </label>
      <label>
        Current password
        <input id="current-password" name="current_password" type="password" autocomplete="current-password" required />
      </label>
      <label>
        New password
        <input id="password" name="password" type="password" autocomplete="new-password" required />
      </label>
      <label>
        Confirm new password
        <input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" required />
      </label>
      <button type="submit">Update password</button>
    </form>
    <p id="result" aria-live="polite"></p>
    <p class="hint">Default hint: <code>demo.user</code> / <code>ExtTest-Pass-2026</code> → new password of your choice.</p>
  </main>
  <script src="shared.js"></script>
  <script>acmeWireChangePassword({ idField: "identifier", defaultUser: "demo.user" });</script>
</body>
</html>
