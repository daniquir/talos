<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acme — Password only</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <main>
    <a class="back" href="index.html">← All variants</a>
    <p class="brand">ACME // NODE</p>
    <h1>Password only</h1>
    <p class="lede">No username field — doorhanger should ask for username before Save.</p>
    <form id="login-form" autocomplete="on">
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Continue</button>
    </form>
    <p id="result" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("result").className = "ok";
      document.getElementById("result").textContent = "Accepted (fake). Enter username in Talos if prompted.";
    });
  </script>
</body>
</html>
