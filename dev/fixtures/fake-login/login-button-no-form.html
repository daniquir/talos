<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acme — No form</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <main>
    <a class="back" href="index.html">← All variants</a>
    <p class="brand">ACME // NODE</p>
    <h1>Login · no &lt;form&gt;</h1>
    <p class="lede">Password fields outside a form; button navigates away (pagehide capture).</p>
    <div class="panel">
      <label>
        Username
        <input id="identifier" name="username" type="text" autocomplete="username" />
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" />
      </label>
      <button type="button" id="btn-go">Continue</button>
    </div>
    <p id="result" aria-live="polite"></p>
  </main>
  <script src="shared.js"></script>
  <script>
    document.getElementById("btn-go").addEventListener("click", () => {
      const user = document.getElementById("identifier").value.trim();
      const pass = document.getElementById("password").value;
      const match = acmeValidate(user, pass);
      if (!match) {
        document.getElementById("result").className = "fail";
        document.getElementById("result").textContent = "Wrong credentials.";
        return;
      }
      acmeGoSuccess(`mode=no-form&user=${encodeURIComponent(user)}`);
    });
  </script>
</body>
</html>
