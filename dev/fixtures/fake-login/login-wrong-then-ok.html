<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acme — Flaky login</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <main>
    <a class="back" href="index.html">← All variants</a>
    <p class="brand">ACME // NODE</p>
    <h1>Login · fails once</h1>
    <p class="lede">First submit always fails; second can succeed. Firefox-style capture still fires on submit (no HTTP success gate).</p>
    <form id="login-form" autocomplete="on">
      <label>
        Username
        <input id="identifier" name="username" type="text" autocomplete="username" required />
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Sign in</button>
    </form>
    <p id="result" aria-live="polite"></p>
  </main>
  <script src="shared.js"></script>
  <script>
    let attempts = 0;
    const form = document.getElementById("login-form");
    const result = document.getElementById("result");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      attempts += 1;
      if (attempts === 1) {
        result.className = "fail";
        result.textContent = "Temporary error (1st try). Submit again.";
        return;
      }
      const match = acmeValidate(
        document.getElementById("identifier").value,
        document.getElementById("password").value
      );
      result.className = match ? "ok" : "fail";
      result.textContent = match
        ? `Signed in as ${match.user}.`
        : "Wrong credentials.";
    });
  </script>
</body>
</html>
